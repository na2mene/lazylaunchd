version: 2

project_name: lazylaunchd

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github-native

brews:
  - repository:
      owner: na2mene
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://github.com/na2mene/lazylaunchd
    description: A lazygit-style TUI for macOS launchd
    license: MIT
    caveats: |
      To finish setup, run:
        lazylaunchd setup
      This installs the background watcher — it records run history and
      sends a macOS notification when a job fails, even while the TUI
      is closed. Re-run it after upgrades. Remove it anytime from the
      TUI (Delete on com.lazylaunchd.watcher).
    install: |
      bin.install "lazylaunchd"
    test: |
      system "#{bin}/lazylaunchd", "--version"
